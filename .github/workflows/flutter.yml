name: Flutter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter 3.41.7
        run: |
          git clone --depth 1 --branch 3.41.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: python3 scripts/check_android_policy.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: flutter analyze
      - run: flutter test
      - name: Check history across daylight saving changes
        run: |
          TZ=Europe/Madrid flutter test --no-pub test/features/station/fuel_price_history_service_test.dart
          TZ=Atlantic/Canary flutter test --no-pub test/features/station/fuel_price_history_service_test.dart
